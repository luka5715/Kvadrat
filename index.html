<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kvadrat.rs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* ── tokeni ── */
:root{
  --bg:#ffffff; --surface:#f7f8fa; --surface2:#eef1f5; --border:#e0e5ec; --border-str:#cdd5e0;
  --text:#1e2129; --muted:#5d6878; --faint:#8a94a4;
  --brand:#1c70ef; --brand-d:#1553c4; --brand-soft:#e9f0fe; --brand-ink:#123a80;
  --accent:#ea5a17; --accent-soft:#fdeee4; --accent-ink:#8a3208;
  --ok:#0f766e; --ok-soft:#e2f3f0;
  --amber:#b45309; --amber-soft:#fdf0da;
  --map-bg:#e8ecef; --map-block:#d6dce2; --map-road:#ffffff; --map-water:#b9d2e8;
  --on-brand:#ffffff; --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(20,28,45,.05),0 6px 20px -10px rgba(20,28,45,.18);
  --shadow-lg:0 10px 34px -12px rgba(20,28,45,.26);
  --r:12px; --r-lg:16px;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-tx:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131a; --surface:#161a22; --surface2:#1d222d; --border:#29303d; --border-str:#39414f;
    --text:#e6eaf1; --muted:#9aa5b6; --faint:#6f7b8d;
    --brand:#5397ff; --brand-d:#7cb1ff; --brand-soft:#152742; --brand-ink:#bcd6ff;
    --accent:#f4793e; --accent-soft:#2b1a11; --accent-ink:#ffc9a8;
    --ok:#4fd1b9; --ok-soft:#11302c; --amber:#f0b45a; --amber-soft:#2e2413;
    --map-bg:#1b212b; --map-block:#242c38; --map-road:#39414f; --map-water:#1d3550;
    --on-brand:#0a1220; --on-accent:#1a0d05;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 14px 40px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#161a22; --surface2:#1d222d; --border:#29303d; --border-str:#39414f;
  --text:#e6eaf1; --muted:#9aa5b6; --faint:#6f7b8d;
  --brand:#5397ff; --brand-d:#7cb1ff; --brand-soft:#152742; --brand-ink:#bcd6ff;
  --accent:#f4793e; --accent-soft:#2b1a11; --accent-ink:#ffc9a8;
  --ok:#4fd1b9; --ok-soft:#11302c; --amber:#f0b45a; --amber-soft:#2e2413;
  --map-bg:#1b212b; --map-block:#242c38; --map-road:#39414f; --map-water:#1d3550;
  --on-brand:#0a1220; --on-accent:#1a0d05;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 14px 40px -14px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-tx);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,strong,.price,.btn,.nav-a,.logo-t{font-family:var(--f-ui)}
h1,h2,h3{margin:0;line-height:1.18;letter-spacing:-.015em;text-wrap:balance;font-weight:800}
h1{font-size:clamp(26px,3.2vw,36px)} h2{font-size:clamp(20px,2.2vw,25px)} h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
img,svg{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13.5px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-inline:20px}
.block{padding-block:44px}
.w-full{width:100%}
.only-m{display:none}

/* ── dugmad ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;
  border:1px solid transparent;font-size:14.5px;font-weight:700;cursor:pointer;background:none;transition:background .15s,border-color .15s,color .15s}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-d)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{filter:brightness(1.07)}
.btn-outline{border-color:var(--border-str);background:var(--bg);color:var(--text)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-ghost{color:var(--muted)} .btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn.is-fav{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;position:relative;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
.dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font:700 10.5px/17px var(--f-ui);text-align:center}
.inp{height:42px;width:100%;padding:0 12px;border:1px solid var(--border-str);border-radius:10px;background:var(--bg);color:var(--text);font-size:14.5px}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
select.inp{cursor:pointer} .multi{height:auto;padding:6px}

/* ── zaglavlje ── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:9px}
.logo-m{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--brand),var(--brand-d));color:#fff}
.logo-t{font-size:18px;font-weight:800;letter-spacing:-.02em}
.logo-t span{color:var(--brand)}
.nav{display:flex;gap:2px;margin-left:8px}
.nav-a{padding:8px 12px;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--muted)}
.nav-a:hover{background:var(--surface2);color:var(--text)}
.nav-a.is-on{color:var(--text);background:var(--surface2)}
.top-r{display:flex;align-items:center;gap:6px;margin-left:auto}

/* ── hero ── */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#123a80,#1553c4 55%,#1c70ef);color:#fff;padding-block:52px 60px}
.hero-art{position:absolute;inset:auto 0 0;height:300px;opacity:.5;pointer-events:none}
.hero-in{position:relative}
.eyebrow{font-family:var(--f-ui);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#a9c9ff}
.hero h1{margin:10px 0 12px;color:#fff;font-size:clamp(30px,4.4vw,46px)}
.lede{max-width:62ch;color:#d7e5ff;font-size:17px}
.hero-stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:26px}
.stat strong{display:block;font-family:var(--f-ui);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:#b9d0f5}

/* ── panel pretrage ── */
.sp{margin-top:24px}
.sp-tabs{display:inline-flex;gap:3px;padding:4px;border-radius:11px 11px 0 0;background:rgba(255,255,255,.16)}
.sp-tab{padding:8px 20px;border:0;border-radius:8px;background:none;color:#e2ecff;font-family:var(--f-ui);font-size:14.5px;font-weight:700;cursor:pointer}
.sp-tab.is-on{background:var(--bg);color:var(--text)}
.sp-row{display:grid;grid-template-columns:1.1fr 1.6fr 1fr auto;gap:10px;padding:14px;background:var(--bg);border-radius:0 var(--r-lg) var(--r-lg) var(--r-lg);box-shadow:var(--shadow-lg)}
.sp-go{height:42px;padding-inline:24px}

/* ── sekcije ── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.head p{margin-top:6px;color:var(--muted);font-size:15px}
.more{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--brand);white-space:nowrap}
.more:hover{text-decoration:underline}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ── kartica oglasa ── */
.card{position:relative;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--border-str);box-shadow:var(--shadow)}
.card-media{position:relative;display:block;aspect-ratio:4/3;background:var(--surface2);overflow:hidden}
.card-media-link{display:block;width:100%;height:100%}
.card-media svg{width:100%;height:100%;transition:transform .5s}
.card:hover .card-media svg{transform:scale(1.045)}
.card-badges{position:absolute;top:11px;left:11px;display:flex;flex-wrap:wrap;gap:5px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-family:var(--f-ui);font-size:11.5px;font-weight:800;letter-spacing:.02em}
.badge-top{background:var(--accent);color:var(--on-accent)}
.badge-prem{background:var(--brand);color:var(--on-brand)}
.badge-ist{background:var(--amber-soft);color:var(--amber)}
.badge-new{background:var(--ok-soft);color:var(--ok)}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-soft{background:var(--surface2);color:var(--muted)}
.fav{position:absolute;top:9px;right:9px;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);color:var(--muted);cursor:pointer;transition:color .15s}
.fav:hover{color:var(--accent)}
.fav.is-on{color:var(--accent)} .fav.is-on svg{fill:var(--accent)}
.shots{position:absolute;right:10px;bottom:10px;padding:3px 8px;border-radius:6px;background:rgba(12,16,24,.72);color:#fff;font-size:11.5px;font-weight:600;pointer-events:none}
.card-body{display:flex;flex-direction:column;gap:9px;padding:14px 15px 15px;flex:1}
.card-price-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.price{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price .per{font-size:12.5px;font-weight:600;color:var(--muted)}
.price-xl{font-size:30px}
.ppm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card-title{font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-title a:hover{color:var(--brand)}
.card-place{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px}
.card-place svg{flex:none;color:var(--faint)}
.specs{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:11px 0 0;border-top:1px solid var(--border);list-style:none}
.specs li{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.specs svg{color:var(--faint)}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:11px;font-size:12.5px;color:var(--muted)}
.agency{display:inline-flex;align-items:center;gap:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verif{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--brand);color:var(--on-brand);flex:none}
.verif svg{width:10px;height:10px;stroke-width:3}
.when{white-space:nowrap;color:var(--faint)}
.card-list{flex-direction:row}
.card-list .card-media{width:290px;flex:none;aspect-ratio:auto}
.card-list .card-media{position:relative}

/* ── kategorije / gradovi ── */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--brand);transform:translateY(-2px)}
.cat-ic{display:grid;place-items:center;width:40px;height:40px;margin-bottom:6px;border-radius:10px;background:var(--brand-soft);color:var(--brand)}
.cat-l{font-family:var(--f-ui);font-weight:700;font-size:15px}
.cat-c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.city{position:relative;display:block;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.city-art{display:block;aspect-ratio:16/10}
.city-art svg{width:100%;height:100%}
.city-b{position:absolute;inset:auto 0 0;display:flex;flex-direction:column;gap:1px;padding:26px 13px 11px;
  background:linear-gradient(transparent,rgba(10,14,22,.82));color:#fff}
.city-b strong{font-size:15.5px;font-weight:700} .city-b span{font-size:12.5px;color:#d6e2f2}

/* ── agencije / članci ── */
.ag-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.agc{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
.agc-logo{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:11px;
  background:hsl(var(--h) 52% 92%);color:hsl(var(--h) 55% 30%);font:800 15px var(--f-ui)}
:root[data-theme="dark"] .agc-logo{background:hsl(var(--h) 30% 20%);color:hsl(var(--h) 70% 78%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .agc-logo{background:hsl(var(--h) 30% 20%);color:hsl(var(--h) 70% 78%)}}
.agc-b{min-width:0} .agc-b h3{display:flex;align-items:center;gap:6px;font-size:15px}
.rate{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.stars{display:inline-flex;color:#e8a33d} .stars svg{fill:#e8a33d;stroke:none;width:13px;height:13px}
.agc-wrap{display:flex;flex-direction:column;gap:12px;padding:6px;border-radius:var(--r-lg)}
.agc-d{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.art{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.art-art{display:block;aspect-ratio:16/9} .art-art svg{width:100%;height:100%}
.art-b{display:flex;flex-direction:column;gap:8px;padding:15px}
.tag{align-self:flex-start;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand-ink);font:700 11.5px var(--f-ui);text-transform:capitalize}
.art-b p{color:var(--muted);font-size:14px}

/* ── rezultati ── */
.res{padding-block:24px 48px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.crumbs a:hover{color:var(--brand)} .crumbs svg{color:var(--faint)}
.res-head h1{margin:10px 0 6px}
.res-sub{color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums}
.res-sub strong{color:var(--text)}
.res-grid{display:grid;grid-template-columns:284px minmax(0,1fr);gap:26px;margin-top:22px;align-items:start}
.rail{position:sticky;top:84px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg);overflow:hidden}
.rail-top{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--border);font-family:var(--f-ui)}
.rail-scroll{max-height:calc(100vh - 190px);overflow-y:auto}
.grp{border-bottom:1px solid var(--border)}
.grp summary{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;font-family:var(--f-ui);font-size:14px;font-weight:700;cursor:pointer;list-style:none}
.grp summary::-webkit-details-marker{display:none}
.grp-ic{display:inline-flex;color:var(--faint);transform:rotate(90deg);transition:transform .15s}
.grp[open] .grp-ic{transform:rotate(-90deg)}
.grp-b{padding:0 15px 14px;display:flex;flex-direction:column;gap:9px}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface2);gap:2px}
.seg-full{display:flex} .seg-full .seg-b{flex:1;justify-content:center}
.seg-b{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:0;border-radius:7px;background:none;color:var(--muted);font:600 13.5px var(--f-ui);cursor:pointer}
.seg-b.is-on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 11px;border:1px solid var(--border-str);border-radius:20px;background:var(--bg);color:var(--muted);font:600 13px var(--f-ui);cursor:pointer}
.pill:hover{border-color:var(--brand);color:var(--brand)}
.pill.is-on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.unit{color:var(--muted);font-size:13.5px}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
.checks{display:flex;flex-direction:column;gap:7px;max-height:210px;overflow-y:auto}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.rail-foot{padding:12px 15px;border-top:1px solid var(--border)}
.res-main{min-width:0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.sort{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:13.5px;color:var(--muted);white-space:nowrap}
.sort .inp{width:auto;min-width:170px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border-str);border-radius:20px;
  background:var(--surface);color:var(--muted);font:600 13px var(--f-ui);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip-clear{border-style:dashed}
.empty{padding:52px 24px;text-align:center;border:1px dashed var(--border-str);border-radius:var(--r-lg);background:var(--surface)}
.empty p{margin:8px 0 0;color:var(--muted)}
.empty-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:30px}
.pg{min-width:38px;height:38px;padding:0 10px;border:1px solid var(--border-str);border-radius:9px;background:var(--bg);
  color:var(--text);font:700 14px var(--f-ui);cursor:pointer;font-variant-numeric:tabular-nums}
.pg:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pg.is-on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pg:disabled{opacity:.4;cursor:not-allowed}
.gap{padding:0 4px;color:var(--faint)}

/* ── detalj ── */
.det{padding-block:20px 50px}
.gal{margin-top:14px}
.gal-main{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--surface2)}
.gal-stage{aspect-ratio:16/9} .gal-stage svg{width:100%;height:100%}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:42px;height:42px;
  border:0;border-radius:50%;background:rgba(12,16,24,.55);color:#fff;cursor:pointer;backdrop-filter:blur(4px)}
.gal-nav:hover{background:rgba(12,16,24,.78)}
.gal-nav.prev{left:12px;transform:translateY(-50%) rotate(180deg)} .gal-nav.next{right:12px}
.gal-count{position:absolute;left:14px;bottom:14px;padding:4px 10px;border-radius:7px;background:rgba(12,16,24,.7);color:#fff;font:600 12.5px var(--f-ui)}
.gal-badges{position:absolute;top:14px;left:14px;display:flex;gap:6px}
.gal-thumbs{display:flex;gap:9px;margin-top:9px;overflow-x:auto;padding-bottom:3px}
.thumb{width:104px;height:70px;flex:none;padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;background:var(--surface2);cursor:pointer}
.thumb svg{width:100%;height:100%} .thumb.is-on{border-color:var(--brand)}
.det-grid{display:grid;grid-template-columns:minmax(0,1fr) 326px;gap:28px;margin-top:26px;align-items:start}
.det-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px}
.det-place{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--muted);font-size:15px}
.det-meta{margin-top:6px;color:var(--faint);font-size:13.5px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.det-meta svg{vertical-align:-2px}
.det-price{text-align:right}
.det-acts{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 4px}
.panel{margin-top:22px;padding:20px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg)}
.panel h2{margin-bottom:13px;font-size:19px}
.prose p{margin-bottom:12px;color:var(--muted);line-height:1.72;max-width:66ch}
.prose p:last-child{margin-bottom:0}
.specs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;margin:0;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.specs-grid dt{padding:10px 13px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.specs-grid dd{padding:10px 13px;margin:0;background:var(--bg);font-family:var(--f-ui);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin:0;padding:0;list-style:none}
.amen li{display:flex;align-items:center;gap:8px;font-size:14.5px}
.amen svg{color:var(--ok);flex:none}
.minimap{border-radius:var(--r);overflow:hidden;aspect-ratio:21/9;background:var(--map-bg)}
.minimap svg{width:100%;height:100%}
.contact{position:sticky;top:84px;display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--border-str);border-radius:var(--r-lg);background:var(--bg);box-shadow:var(--shadow)}
.contact-who{display:flex;align-items:center;gap:11px;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.avatar{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font:800 15px var(--f-ui)}
.contact-who strong{display:block;font-size:15px} .contact-who .muted{font-size:13px}
.is-revealed{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.safety{margin-top:6px;padding:11px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:12.5px;line-height:1.5}

/* ── mapa ── */
.mapwrap{position:relative;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--map-bg)}
.bigmap{aspect-ratio:16/11} .bigmap svg{width:100%;height:100%}
.pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);padding:4px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--border-str);
  color:var(--text);font:700 12px var(--f-ui);white-space:nowrap;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.pin:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand);z-index:5}
.pin-promo{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pin-promo:hover{background:var(--accent);filter:brightness(1.1)}
.map-note{padding:12px 15px;border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px}

/* ── kalkulator ── */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.calc-in{margin-top:0;display:flex;flex-direction:column;gap:16px}
.cfield{display:flex;flex-direction:column;gap:7px}
.cfield label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--f-ui);font-size:13.5px;font-weight:700;color:var(--muted)}
.cfield .inp{width:120px;text-align:right;font-variant-numeric:tabular-nums}
.cfield input[type=range]{width:100%;accent-color:var(--brand)}
.calc-out{display:flex;flex-direction:column;gap:16px}
.calc-hero{padding:22px;border-radius:var(--r-lg);background:linear-gradient(150deg,var(--brand),var(--brand-d));color:#fff}
.calc-label{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.86}
.calc-big{font-family:var(--f-ui);font-size:42px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.calc-sub{font-size:13.5px;opacity:.9;margin-top:4px}
.calc-rows{display:grid;grid-template-columns:1fr auto;gap:1px;margin:0;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.calc-rows dt{padding:10px 14px;background:var(--bg);font-size:14px;color:var(--muted)}
.calc-rows dd{padding:10px 14px;margin:0;background:var(--bg);text-align:right;font-family:var(--f-ui);font-weight:700;font-variant-numeric:tabular-nums}
.calc-chart{padding:18px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg)}
.calc-chart .calc-label{color:var(--muted)}
.chart{height:150px;margin-top:12px} .chart svg{width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:11px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg::before{content:'';width:11px;height:11px;border-radius:3px}
.lg-b::before{background:var(--brand)} .lg-a::before{background:var(--accent)}

/* ── podnožje / toast ── */
.foot{margin-top:40px;border-top:1px solid var(--border);background:var(--surface)}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;padding-block:26px}
.foot-b{font-family:var(--f-ui);font-weight:800;font-size:16px}
.foot-nav{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--muted)}
.foot-nav a:hover{color:var(--brand)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{padding:11px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow-lg)}

/* ── responsivno ── */
@media (max-width:1040px){
  .res-grid{grid-template-columns:1fr}
  .det-grid{grid-template-columns:1fr}
  .contact{position:static}
  .calc{grid-template-columns:1fr}
  .rail{position:fixed;inset:0;z-index:60;border-radius:0;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column}
  .rail.open{transform:none}
  .rail-scroll{flex:1;max-height:none}
  .only-m{display:inline-flex}
  .nav{display:none}
  .sp-row{grid-template-columns:1fr 1fr}
  .sp-go{grid-column:1/-1}
}
@media (max-width:680px){
  .sp-row{grid-template-columns:1fr}
  .card-list{flex-direction:column}
  .card-list .card-media{width:100%;aspect-ratio:4/3}
  .det-price{text-align:left}
  .hero-stats{gap:18px}
  .top-in{gap:10px}
  .sort{width:100%;margin-left:0}
  .sort .inp{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="data.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>

</body></html>
