<meta name="color-scheme" content="light dark">
<script>
/* tema pre prvog crtanja (bez bljeska): kv.theme = 'light' | 'dark'; bez vrednosti važi sistemska */
(function () { try { var t = localStorage.getItem('kv.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* localStorage nedostupan */ } })();
/* pismo pre prvog crtanja: kv.script = 'cyr' → lang="sr-Cyrl" (fontovi sa ćirilicom, vidi shell.css) */
(function () { try { if (localStorage.getItem('kv.script') === 'cyr') document.documentElement.setAttribute('lang', 'sr-Cyrl'); } catch (e) { /* localStorage nedostupan */ } })();
</script>
