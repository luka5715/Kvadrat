<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kvadrat — test početne</title>
<meta name="description" content="Dev stranica: viewHome (js/pages/home.js) samostalno, sa zaglavljem i podnožjem iz ui.js. Ruta: #/ (podrazumevano).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,50;1,9..144,300..700,50&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/pages/home.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script src="../../data.js" charset="utf-8"></script>
<script src="../../js/core.js" charset="utf-8"></script>
<script src="../../js/images.js" charset="utf-8"></script>
<script src="../../js/ui.js" charset="utf-8"></script>
<script src="../../js/engine.js" charset="utf-8"></script>
<script src="../../js/map.js" charset="utf-8"></script>
<script src="../../js/pages/home.js" charset="utf-8"></script>
<script>
/* mini ruter dev stranice: #/ → viewHome; svaka druga ruta prikazuje traku sa odredištem (za proveru linkova i pretrage). */
(function () {
  'use strict';
  const app = document.getElementById('app');
  function render() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = raw.split('?');
    const q = new URLSearchParams(qs || '');
    app.innerHTML = '';
    let body;
    if (path === '/' || path === '') body = viewHome(q);
    else body = el('div', { class: 'wrap', style: 'padding:48px 16px' }, el('p', { class: 'eyebrow' }, 'dev/home — odredište'),
      el('h1', { class: 't-h1', id: 'dest' }, raw), el('p', { style: 'margin-top:16px' }, el('a', { class: 'btn btn-secondary', href: '#/' }, 'Nazad na početnu')));
    app.append(header(path), el('main', { id: 'main' }, body), footer());
    if (path === '/' || path === '') window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  try { if (typeof KX !== 'undefined') KX.enrich(); } catch (e) { console.error(e); }
  render();
})();
</script>
</body>
</html>
