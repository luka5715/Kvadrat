<script src="../../data.js" charset="utf-8"></script>

<script src="../../js/pages/content.js" charset="utf-8"></script>
<script>
/* mini ruter dev stranice: #/novogradnja, #/projekat?s=, #/saveti, #/savet?s=; ostale rute prikazuju odredište (provera linkova). */
(function () {
  'use strict';
  const app = document.getElementById('app');
  const ROUTES = { '/novogradnja': viewProjects, '/projekat': viewProject, '/saveti': viewArticles, '/savet': viewArticle };
  function render() {
    const raw = location.hash.replace(/^#/, '') || '/novogradnja';
    const [path, qs] = raw.split('?');
    const q = new URLSearchParams(qs || '');
    app.innerHTML = '';
    const fn = ROUTES[path];
    const body = fn ? fn(q) : el('div', { class: 'wrap', style: 'padding:48px 16px' }, el('p', { class: 'eyebrow' }, 'dev/content — odredište'),
      el('h1', { class: 't-h1', id: 'dest' }, raw), el('p', { style: 'margin-top:16px' }, el('a', { class: 'btn btn-secondary', href: '#/novogradnja' }, 'Nazad na novogradnju')));
    app.append(header(path), el('main', { id: 'main' }, body), footer());
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  try { if (typeof KX !== 'undefined') KX.enrich(); } catch (e) { console.error(e); }
  render();
})();
</script>
</body>
</html>
